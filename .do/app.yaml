name: coversfolio
region: sgp

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: coversfolio-coder/Coversfolio_main
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    envs:
      - key: MONGO_URL
        value: PASTE_YOUR_NEW_ROTATED_MONGO_CONNECTION_STRING_HERE
        type: SECRET
      - key: DB_NAME
        value: coversfolio_production
      - key: JWT_SECRET
        value: NVcgflwV8WEJnbmZQtT6Q4VtvTfKNJ7F_Hw8JfSfURgGaSy6bEbF6-AD2KqubsvN
        type: SECRET
      - key: CORS_ORIGINS
        value: https://coversfolio.com
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: coversfolio-documents
      - key: S3_ENDPOINT_URL
        value: https://sgp1.digitaloceanspaces.com
      - key: S3_REGION
        value: sgp1
      - key: S3_ACCESS_KEY
        value: PASTE_YOUR_SPACES_ACCESS_KEY_HERE
        type: SECRET
      - key: S3_SECRET_KEY
        value: PASTE_YOUR_SPACES_SECRET_KEY_HERE
        type: SECRET
      - key: GEMINI_MODEL
        value: gemini-flash-latest

static_sites:
  - name: frontend
    source_dir: frontend
    github:
      repo: coversfolio-coder/Coversfolio_main
      branch: main
      deploy_on_push: true
    build_command: npm install --legacy-peer-deps && npm run build
    output_dir: build
    routes:
      - path: /
    envs:
      - key: REACT_APP_BACKEND_URL
        value: https://coversfolio.com

domains:
  - domain: coversfolio.com
    type: PRIMARY